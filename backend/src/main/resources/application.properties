server.port=8080

# --- Flow (sandbox para pruebas) ---
# Cambia a https://www.flow.cl/api cuando pases a producción.
flow.api-url=${FLOW_API_URL:https://sandbox.flow.cl/api}
flow.api-key=${FLOW_API_KEY:}
flow.secret-key=${FLOW_SECRET_KEY:}

# --- URLs de la app ---
# IMPORTANTE: app.base-url debe ser una URL PÚBLICA que Flow pueda alcanzar
# (para el webhook de confirmación). En local usa un túnel tipo ngrok.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
